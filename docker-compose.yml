services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: shop-hisab-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/shop_hisab?authSource=admin
      MONGODB_DB: shop_hisab
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENING_BALANCE_PAISE: ${OPENING_BALANCE_PAISE:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Kolkata
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shop-network

  mongodb:
    image: mongo:7
    container_name: shop-hisab-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      TZ: Asia/Kolkata
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok" | grep -q 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shop-network

volumes:
  mongo_data:

networks:
  shop-network:
    driver: bridge
